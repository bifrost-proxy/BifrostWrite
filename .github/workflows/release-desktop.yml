name: Release BifrostWrite

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.7.1
        required: true
        type: string

concurrency:
  group: release-bifrostwrite-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - id: release
        name: Validate version metadata
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          node scripts/sync-tauri-version.mjs --check "$VERSION"
          node scripts/check-no-telemetry.mjs
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bifrostwrite-${{ matrix.target }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and stage lightweight native backend
        working-directory: apps/desktop
        run: node scripts/stage-tauri-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Tauri DMG
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --config src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles dmg

      - name: Verify and smoke packaged DMG
        working-directory: apps/desktop
        shell: bash
        run: |
          DMG_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$DMG_PATH"
          bash scripts/verify-macos-dmg.sh "$DMG_PATH" "${{ matrix.target }}"

      - name: Package release asset
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          SOURCE=$(find "src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$SOURCE"
          mkdir -p dist
          ASSET="BifrostWrite-v${VERSION}-${TARGET}.dmg"
          cp "$SOURCE" "dist/$ASSET"
          (
            cd dist
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: bifrostwrite-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: bifrostwrite-*
          path: release
          merge-multiple: true

      - name: Create checksums file
        shell: bash
        run: |
          cd release
          cat ./*.sha256 > "BifrostWrite-${{ needs.prepare.outputs.tag }}-checksums.txt"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_TITLE="BifrostWrite $RELEASE_TAG"
          RELEASE_NOTES=$'## Install with Homebrew\n\n```bash\nbrew tap bifrost-proxy/bifrost\nbrew install --cask bifrostwrite\n```'

          release_exists() {
            gh release view "$RELEASE_TAG" >/dev/null 2>&1
          }

          if ! release_exists; then
            CREATED=0
            for ATTEMPT in 1 2 3 4 5; do
              if gh release create "$RELEASE_TAG" \
                --draft \
                --generate-notes \
                --title "$RELEASE_TITLE" \
                --notes "$RELEASE_NOTES"; then
                CREATED=1
                break
              fi
              if release_exists; then
                CREATED=1
                break
              fi
              sleep $((ATTEMPT * 5))
            done
            test "$CREATED" -eq 1
          fi

          for ASSET in release/*; do
            UPLOADED=0
            for ATTEMPT in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" "$ASSET" --clobber; then
                UPLOADED=1
                break
              fi
              sleep $((ATTEMPT * 5))
            done
            test "$UPLOADED" -eq 1
          done

          PRERELEASE=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --draft=false \
            --prerelease="$PRERELEASE"
