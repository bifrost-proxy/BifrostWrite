name: Release BifrostWrite

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.7.1
        required: true
        type: string

concurrency:
  group: release-bifrostwrite-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - id: release
        name: Validate version metadata
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          node scripts/sync-tauri-version.mjs --check "$VERSION"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bifrostwrite-${{ matrix.target }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and stage native runtime
        working-directory: apps/desktop
        run: node scripts/stage-tauri-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Tauri DMG
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --config src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles dmg

      - name: Verify and smoke packaged DMG
        working-directory: apps/desktop
        env:
          BIFROSTWRITE_TAURI_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          DMG_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$DMG_PATH"
          MOUNT_DIR=$(mktemp -d "${TMPDIR:-/tmp}/bifrostwrite-dmg.XXXXXX")
          MOUNTED=0
          cleanup() {
            if [[ $MOUNTED -eq 1 ]]; then
              hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true
            fi
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_DIR" >/dev/null
          MOUNTED=1
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 1 -type d -name 'BifrostWrite.app' -print -quit)
          test -n "$APP_PATH"

          APP_BINARY="$APP_PATH/Contents/MacOS/bifrostwrite"
          SIDECAR="$APP_PATH/Contents/Resources/native-backend/neverwrite-native-backend"
          test -x "$APP_BINARY"
          test -x "$SIDECAR"
          test ! -e "$APP_PATH/Contents/Frameworks/Electron Framework.framework"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) EXPECTED_ARCH=arm64 ;;
            x86_64-apple-darwin) EXPECTED_ARCH=x86_64 ;;
            *) exit 2 ;;
          esac
          ARCHS=" $(lipo -archs "$APP_BINARY") "
          [[ "$ARCHS" == *" $EXPECTED_ARCH "* ]]

          codesign --verify --deep --strict "$APP_PATH"
          du -sh "$APP_PATH"
          BIFROSTWRITE_PACKAGED_SIDECAR_PATH="$SIDECAR" node scripts/smoke-packaged-sidecar.mjs

      - name: Package release asset
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          SOURCE=$(find "src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$SOURCE"
          mkdir -p dist
          ASSET="BifrostWrite-v${VERSION}-${TARGET}.dmg"
          cp "$SOURCE" "dist/$ASSET"
          (
            cd dist
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: bifrostwrite-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: bifrostwrite-*
          path: release
          merge-multiple: true

      - name: Create checksums file
        shell: bash
        run: |
          cd release
          cat ./*.sha256 > "BifrostWrite-${{ needs.prepare.outputs.tag }}-checksums.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BifrostWrite ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Install with Homebrew

            ```bash
            brew tap bifrost-proxy/bifrost
            brew install --cask bifrostwrite
            ```
