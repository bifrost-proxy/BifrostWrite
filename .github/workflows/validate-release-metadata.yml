name: Validate Tauri Release Metadata

on:
  pull_request:
    paths:
      - CHANGELOG.md
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - apps/desktop/build/**
      - apps/desktop/embedded/**
      - apps/desktop/scripts/stage-native-runtime-assets*.mjs
      - apps/desktop/scripts/stage-tauri-sidecar.mjs
      - apps/desktop/src-tauri/**
      - scripts/sync-tauri-version.mjs
      - .github/workflows/release-desktop.yml
      - .github/workflows/validate-release-metadata.yml
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Version and bundle contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate version sources
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          node scripts/sync-tauri-version.mjs --check "$VERSION"

      - name: Validate release tag alignment
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-tauri-version.mjs --check "${GITHUB_REF_NAME#v}"

      - name: Check release scripts
        run: |
          node --check scripts/sync-tauri-version.mjs
          bash -n apps/desktop/scripts/verify-macos-dmg.sh
          node --check apps/desktop/scripts/stage-native-runtime-assets.mjs
          node --check apps/desktop/scripts/stage-tauri-sidecar.mjs
          node --check apps/desktop/scripts/smoke-packaged-sidecar.mjs

      - name: Validate Tauri configuration
        run: |
          node -e "const c=require('./apps/desktop/src-tauri/tauri.conf.json'); if(c.productName!=='BifrostWrite'||c.identifier!=='com.bifrostwrite.desktop') process.exit(1)"
          node -e "const c=require('./apps/desktop/src-tauri/tauri.conf.json'); if(JSON.stringify(c.bundle.targets)!=='[\"app\",\"dmg\"]') process.exit(1)"
