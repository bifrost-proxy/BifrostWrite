name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            pkg-config \
            wget

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test

  ai-history-windows:
    name: AI history recovery (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run AI history transaction tests
        run: cargo test -p neverwrite-native-backend ai_history::migration --no-fail-fast

  desktop:
    name: Desktop (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Reject telemetry dependencies
        run: node scripts/check-no-telemetry.mjs

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run desktop lint
        working-directory: apps/desktop
        run: npm run lint

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Build renderer
        working-directory: apps/desktop
        run: npm run renderer:build

      - name: Build native desktop sidecar
        run: cargo build -p neverwrite-native-backend

      - name: Check Tauri shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test Tauri shell
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run vault/editor smoke
        working-directory: apps/desktop
        run: node scripts/smoke-native-vault-editor.mjs

      - name: Run AI runtime smoke
        working-directory: apps/desktop
        run: node scripts/smoke-native-ai-runtime.mjs

  macos-dmg:
    name: macOS DMG (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bifrostwrite-${{ matrix.target }}

      - name: Reject telemetry dependencies
        run: node scripts/check-no-telemetry.mjs

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and stage lightweight native backend
        working-directory: apps/desktop
        run: node scripts/stage-tauri-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Tauri DMG
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --config src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles dmg

      - name: Verify and smoke packaged DMG
        working-directory: apps/desktop
        shell: bash
        run: |
          DMG_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$DMG_PATH"
          bash scripts/verify-macos-dmg.sh "$DMG_PATH" "${{ matrix.target }}"

      - name: Package CI artifact
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARGET="${{ matrix.target }}"
          SOURCE=$(find "src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$SOURCE"
          mkdir -p dist
          ASSET="BifrostWrite-v${VERSION}-${TARGET}.dmg"
          cp "$SOURCE" "dist/$ASSET"
          (
            cd dist
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          )

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: bifrostwrite-ci-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  web-clipper:
    name: Web Clipper
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web-clipper/pnpm-lock.yaml

      - name: Install web clipper dependencies
        working-directory: apps/web-clipper
        run: pnpm install --frozen-lockfile

      - name: Run web clipper checks
        working-directory: apps/web-clipper
        run: pnpm run check
